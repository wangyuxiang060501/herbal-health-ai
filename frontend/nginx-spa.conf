# 前端镜像内置配置：只管 SPA 路由回落
# 生产环境请挂载 deploy/nginx.conf 覆盖此文件（那份带 /api 反向代理与 HTTPS）

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA：/result/xxx 这类前端路由刷新时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 必须不缓存，否则发版后用户还在用旧页面
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
