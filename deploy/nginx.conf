# ============================================================================
# 生产 Nginx：前端静态文件 + 后端 API 反向代理（6.3.2）
#
# 用法（docker-compose.prod.yml 会把它挂到 /etc/nginx/conf.d/default.conf）：
#   把 ${DOMAIN} 换成实际域名，例如 herb.example.com
#   证书由 deploy/init-ssl.sh 申请，路径保持下面的一致
# ============================================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

# HTTP：除 ACME 校验外全部跳 HTTPS
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt 的 HTTP-01 校验要走明文，不能重定向
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 安全响应头（HSTS 先注释掉：确认 HTTPS 稳定后再开，否则回滚很麻烦）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    # ---- 静态文件 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE 必须关掉缓冲，否则流式输出会被攒成一坨，
        #   前端看到的就不是打字机效果而是最后一次性弹出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass http://backend;
        access_log off;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
