# ============================================================================
# 开发环境编排（清单 1.4.2）
#
#   docker compose up --build
#   → 前端 http://localhost:5173（Vite dev server，带热更新）
#   → 后端 http://localhost:8000/docs
#
# 与生产编排（docker-compose.prod.yml）的区别：
#   · 前端跑 dev server 而非构建产物，改代码即时生效
#   · 后端挂载源码目录，改代码 uvicorn --reload 自动重启
#   · 不启用 HTTPS，不对公网开放
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: herb-backend:dev
    container_name: herb-backend-dev
    env_file: .env
    environment:
      APP_ENV: development
      DEBUG: "true"
      # 离线自检：不配 API Key 也能把整条链路跑通
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_FALLBACK_CHAIN: ${LLM_FALLBACK_CHAIN:-mock}
      DATABASE_URL: sqlite:////app/var/app.db
      CHECKPOINT_DB_PATH: /app/var/langgraph_ckpt.sqlite
      RAG_CHROMA_DIR: /app/var/chroma
      RAG_INDEX_PATH: /app/var/rag_index.jsonl
    volumes:
      - backend-data-dev:/app/var
      - ./backend:/app
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:22-alpine
    container_name: herb-frontend-dev
    working_dir: /app
    environment:
      # dev server 要能被宿主机访问，Vite 必须监听 0.0.0.0
      VITE_BACKEND: http://backend:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - backend

volumes:
  backend-data-dev:
    name: herb-backend-data-dev
