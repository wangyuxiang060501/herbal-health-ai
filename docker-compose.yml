# ============================================================================
# 中医药智慧康养系统 — 一键启动
#
# 使用方法：
#   1. 安装 Docker Desktop（https://www.docker.com/products/docker-desktop/）
#   2. 在本目录打开终端，执行：docker compose up -d --build
#   3. 打开浏览器访问 http://localhost
#
# 停止：docker compose down
# 重启：docker compose restart
# 查看日志：docker logs -f herbal-backend
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: herbal-backend:latest
    container_name: herbal-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/var/app.db
      CHECKPOINT_DB_PATH: /app/var/langgraph_ckpt.sqlite
      RAG_CHROMA_DIR: /app/var/chroma
      RAG_INDEX_PATH: /app/var/rag_index.jsonl
      RAG_KB_PATH: data/kb/chunks.jsonl
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"
      LLM_PROVIDER: mock
      LLM_MODEL: mock
      LLM_FALLBACK_CHAIN: mock
      LLM_TIMEOUT: "180"
      LLM_MAX_TOKENS: "4096"
      APP_SECRET_KEY: herbal-2026-secret-key
      MONTHLY_BUDGET_CNY: "200.0"
    volumes:
      - herbal-data:/app/var
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: herbal-frontend:latest
    container_name: herbal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  herbal-data:
    name: herbal-data