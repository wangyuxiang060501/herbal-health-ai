# ============================================================================
# 生产编排：后端 + 前端(Nginx 反向代理) + certbot 续期（6.3.1 / 6.3.2 / 6.3.3）
#
# 前置条件（这几件事做不了自动化，必须人工完成，见 deploy/部署手册.md）：
#   1. 域名已完成 ICP 备案（中国大陆服务器访问的前提）—— 6.3.4
#   2. 域名 A 记录已指向本机公网 IP
#   3. 云安全组已放行 80 / 443
#
# 启动顺序：
#   export DOMAIN=your.domain.com
#   cp .env.example .env && 编辑 .env
#   docker compose -f docker-compose.prod.yml up -d --build
#   ./deploy/init-ssl.sh $DOMAIN          # 首次申请证书
#
# 证书有效期 90 天，certbot 容器每 12 小时自动检查续期。
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: herb-backend:latest
    container_name: herb-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内路径与 .env 里的宿主机路径不同，这里显式覆盖
      DATABASE_URL: sqlite:////app/var/app.db
      CHECKPOINT_DB_PATH: /app/var/langgraph_ckpt.sqlite
      RAG_CHROMA_DIR: /app/var/chroma
      RAG_INDEX_PATH: /app/var/rag_index.jsonl
      RAG_KB_PATH: data/kb/chunks.jsonl
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - backend-data:/app/var
    # 不对外暴露端口，只能由 nginx 通过内网访问 —— 减少一个攻击面
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: herb-frontend:latest
    container_name: herb-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 覆盖镜像内置的简单 SPA 配置，换成带 API 反代 + HTTPS 的生产配置
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy

  certbot:
    image: certbot/certbot:latest
    container_name: herb-certbot
    # 每 12 小时检查一次续期（Let's Encrypt 证书 90 天有效）
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  # 显式命名：否则 compose 会加上项目名前缀，deploy/init-ssl.sh 里就不好引用
  backend-data:
    name: herb-backend-data
  certbot-webroot:
    name: herb-certbot-webroot
  certbot-certs:
    name: herb-certbot-certs
